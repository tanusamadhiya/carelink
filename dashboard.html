<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CareLink — Hospital Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container center">
    <div class="top-row">
      <h2>Hospital Dashboard</h2>
      <a class="link" href="index.html">← Home</a>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num" id="statReferrals">0</div>
        <div class="stat-label">Active Referrals</div>
      </div>

      <div class="stat">
        <div class="stat-num" id="statAmb">0</div>
        <div class="stat-label">Ambulances On Route</div>
      </div>

      <div class="stat">
        <div class="stat-num" id="statDone">0</div>
        <div class="stat-label">Completed Cases</div>
      </div>
    </div>

    <h3>Incoming Referrals</h3>
    <div id="incoming" class="list"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
