<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CareLink — Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container center">
    <h1 class="brand">CareLink</h1>
    <p class="lead">Connecting rural health workers, ambulances, and hospitals in real-time to save lives.</p>

    <div class="roles">
      <button class="role-btn" onclick="login('worker')">Health Worker</button>
      <button class="role-btn" onclick="login('hospital')">Hospital</button>
      <button class="role-btn" onclick="login('doctor')">Doctor</button>
    </div>

    <div class="footer-note">
      <small>Prototype — demo only. Use the browser Back button to return to this menu.</small>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
